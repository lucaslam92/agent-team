$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://auto-dev-agent.local/schemas/backend-design/api_contract.schema.yaml"
title: "Backend API Contract"
type: object
additionalProperties: false
required:
  - version
  - feature_id
  - feature_name
  - service
  - owners
  - status
  - design_basis
  - global_conventions
  - apis
  - events
  - jobs
  - shared_types
  - verification_mapping
properties:
  version:
    type: string
  feature_id:
    type: string
  feature_name:
    type: string
  service:
    type: string
  owners:
    type: array
    items:
      type: string
  status:
    type: string
  design_basis:
    type: array
    items:
      type: string
  global_conventions:
    type: array
    items:
      type: string
  apis:
    type: array
    items:
      $ref: "#/$defs/api"
  events:
    type: array
    items:
      $ref: "#/$defs/event"
  jobs:
    type: array
    items:
      $ref: "#/$defs/job"
  shared_types:
    type: array
    items:
      $ref: "#/$defs/sharedType"
  verification_mapping:
    type: array
    items:
      $ref: "#/$defs/verificationMapping"
$defs:
  api:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - summary
      - kind
      - protocol
      - method
      - path
      - tags
      - ownership
      - auth
      - idempotency
      - request
      - response
      - errors
      - side_effects
      - state_effects
      - consistency
      - observability
      - dependencies
      - acceptance_refs
      - test_requirements
    properties:
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      kind:
        type: string
      protocol:
        type: string
      method:
        type: string
      path:
        type: string
      tags:
        type: array
        items:
          type: string
      ownership:
        type: string
      auth:
        type: object
      idempotency:
        type: object
      request:
        type: object
      response:
        type: object
      errors:
        type: array
        items:
          $ref: "#/$defs/error"
      side_effects:
        $ref: "#/$defs/sideEffects"
      state_effects:
        type: array
        items:
          type: string
      consistency:
        $ref: "#/$defs/consistency"
      observability:
        type: array
        items:
          type: string
      dependencies:
        type: array
        items:
          type: string
      acceptance_refs:
        type: array
        items:
          type: string
      test_requirements:
        type: array
        items:
          type: string
  error:
    type: object
    additionalProperties: false
    required:
      - code
      - category
      - http_status
      - retryable
      - user_visible
      - description
    properties:
      code:
        type: string
      category:
        type: string
      http_status:
        type: integer
      retryable:
        type: boolean
      user_visible:
        type: boolean
      description:
        type: string
  sideEffects:
    type: object
    additionalProperties: false
    required:
      - writes
      - publishes
      - cache_updates
      - external_calls
    properties:
      writes:
        type: array
        items:
          type: string
      publishes:
        type: array
        items:
          type: string
      cache_updates:
        type: array
        items:
          type: string
      external_calls:
        type: array
        items:
          type: string
  consistency:
    type: object
    additionalProperties: false
    required:
      - mode
      - boundary
      - client_expectation
    properties:
      mode:
        type: string
      boundary:
        type: string
      client_expectation:
        type: string
  event:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - topic
      - producer
      - consumers
      - trigger
      - payload
      - delivery
      - observability
      - acceptance_refs
      - test_requirements
    properties:
      id:
        type: string
      name:
        type: string
      topic:
        type: string
      producer:
        type: string
      consumers:
        type: array
        items:
          type: string
      trigger:
        type: string
      payload:
        type: object
      delivery:
        type: object
      observability:
        type: array
        items:
          type: string
      acceptance_refs:
        type: array
        items:
          type: string
      test_requirements:
        type: array
        items:
          type: string
  job:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - trigger
      - schedule
      - module
      - input
      - effects
      - failure_policy
      - observability
      - acceptance_refs
    properties:
      id:
        type: string
      name:
        type: string
      trigger:
        type: string
      schedule:
        type: string
      module:
        type: string
      input:
        type: object
      effects:
        type: array
        items:
          type: string
      failure_policy:
        type: string
      observability:
        type: array
        items:
          type: string
      acceptance_refs:
        type: array
        items:
          type: string
  sharedType:
    type: object
    additionalProperties: false
    required:
      - name
      - kind
      - schema
    properties:
      name:
        type: string
      kind:
        type: string
      schema:
        type: object
  verificationMapping:
    type: object
    additionalProperties: false
    required:
      - acceptance_ref
      - contract_refs
      - checks
    properties:
      acceptance_ref:
        type: string
      contract_refs:
        type: array
        items:
          type: string
      checks:
        type: array
        items:
          type: string
